name: hueeng-sites
# 홈서버(Proxmox LXC 101): 후엥(Hueeng) 정적 사이트를 nginx 하나로.
#   서버 배치: /opt/hueeng-sites ← 이 저장소 clone (서브모듈 포함)
#   갱신:      ./deploy.sh — GitHub 러너(push 마다)와 hueeng-sites-sync.timer(5분마다)가 호출한다. 직접 compose 를 돌릴 일은 없다.
#   공개:      주 cloudflared(systemd) ingress — jomhae·car·hanjang·fly·passport → http://localhost:3108
# 설정은 파일이 아니라 디렉터리로 마운트한다: git 이 파일을 새로 쓰면(새 inode) 파일 단위 마운트는 옛 내용을 계속 본다.
services:
  web:
    image: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    container_name: hueeng-sites-web
    restart: unless-stopped
    ports: ["127.0.0.1:3108:80"]
    volumes:
      - ./sites:/srv/sites:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
      - /tmp:size=8m
    mem_limit: 96m
    pids_limit: 64
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
