# 모든 사이트 공통 (server 블록에서 include)
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Strict-Transport-Security "max-age=31536000" always;
# no-transform: Cloudflare 가 mailto 를 email-protection 으로 바꾸지 않게 (심사 도구·크롤러가 이메일을 그대로 읽는다)
add_header Cache-Control "public, max-age=600, no-transform" always;
# 저장소 내부 파일은 공개하지 않는다 (.git 등; .well-known 은 허용)
location ~ /\.(?!well-known/) { return 404; }
location = /README.md { return 404; }
