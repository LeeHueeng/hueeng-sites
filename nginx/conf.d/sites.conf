# hueeng-sites — 후엥(Hueeng) 정적 사이트를 nginx 하나가 호스트 이름으로 나눠 서빙한다.
# 콘텐츠는 /srv/sites/<site>/ (= 저장소 sites/<site>/). car·fly·passport 는 각 프로젝트 저장소의 서브모듈이다.
# 공통 헤더·차단 규칙은 /etc/nginx/snippets/common.conf (server 마다 include).
# location 안에서는 add_header 를 쓰지 않는다 — 쓰면 server 의 공통 헤더가 그 location 에 상속되지 않는다.
server_tokens off;

# Cloudflare 가 알려 주는 방문자 스킴. http 로 온 방문자는 https 로 보낸다.
map $http_x_forwarded_proto $plain_http { default 0; http 1; }

# 모르는 호스트는 404. /healthz 는 컨테이너·홈랩 상태 페이지·HA 수집기용(Host 없이 확인).
server {
    listen 80 default_server;
    server_name _;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { return 404; }
}

# 좀 해! — 소개·도움말·약관·개인정보·계정 삭제·친구 초대
server {
    listen 80;
    server_name jomhae.hueeng.com;
    root /srv/sites/jomhae;
    index index.html;
    if ($plain_http) { return 308 https://$host$request_uri; }
    include /etc/nginx/snippets/common.conf;
    # 유니버설 링크 검증 파일 — 확장자 없음, JSON 으로 서빙
    location = /.well-known/apple-app-site-association { default_type application/json; }
    # 친구 초대: /f/<코드> → friend.html (코드는 JS 가 경로에서 읽음)
    location /f/ { try_files $uri /friend.html; }
    location / { try_files $uri $uri/ $uri.html =404; }
}

# 심플차계부 — 원본 LeeHueeng/simcha-site (GitHub Pages leehueeng.github.io/simcha-site/ 와 같은 파일)
server {
    listen 80;
    server_name car.hueeng.com;
    root /srv/sites/car;
    index index.html;
    absolute_redirect off;
    # app-ads.txt 는 광고 크롤러용으로 http 그대로 둔다
    set $force_https $plain_http;
    if ($request_uri ~ "^/app-ads\.txt(\?|$)") { set $force_https 0; }
    if ($force_https) { return 301 https://$host$request_uri; }
    include /etc/nginx/snippets/common.conf;
    # GitHub Pages 주소 형태(/simcha-site/...)로 들어와도 같은 문서
    location ^~ /simcha-site/ { rewrite ^/simcha-site/(.*)$ /$1 last; }
    location ^~ /deploy/ { return 404; }
    # 앱 채팅방 초대 링크: 안내 페이지(앱에서 열기 버튼)를 200 으로
    location ^~ /chat/invite/ { default_type text/html; try_files /404.html =404; }
    # /privacy → privacy.html (확장자 없는 주소)
    location / { try_files $uri $uri.html $uri/ =404; }
    error_page 404 /404.html;
}

# 한장 — 소개·개인정보(한/영)
server {
    listen 80;
    server_name hanjang.hueeng.com;
    root /srv/sites/hanjang;
    index index.html;
    if ($plain_http) { return 308 https://$host$request_uri; }
    include /etc/nginx/snippets/common.conf;
    location / { try_files $uri $uri/ $uri.html =404; }
}

# FLY LAB — 원본 LeeHueeng/fly-lab (앱 저장소 그대로). 개발용 파일은 공개하지 않는다.
server {
    listen 80;
    server_name fly.hueeng.com;
    root /srv/sites/fly;
    index index.html;
    charset utf-8;
    if ($plain_http) { return 308 https://$host$request_uri; }
    include /etc/nginx/snippets/common.conf;
    location ~ ^/(scripts/|server\.js$|package(-lock)?\.json$|Dockerfile$|CONTRIBUTING\.md$|SECURITY\.md$|README\.ko\.md$|LICENSE$) { return 404; }
    location / { try_files $uri $uri/ =404; }
}

# 여행여권 — 원본 LeeHueeng/phototravelmap-site (GitHub Pages leehueeng.github.io/phototravelmap-site/).
# 같은 파일을 이 도메인 기준 URL(canonical·og·사이트맵)로 바꿔 내보내고, 이 도메인의 네이버 인증을 붙인다.
server {
    listen 80;
    server_name passport.hueeng.com;
    root /srv/sites/passport;
    index index.html;
    if ($plain_http) { return 308 https://$host$request_uri; }
    include /etc/nginx/snippets/common.conf;
    sub_filter_types text/plain text/xml application/xml;
    sub_filter_once off;
    sub_filter 'https://leehueeng.github.io/phototravelmap-site/' 'https://passport.hueeng.com/';
    sub_filter '</head>' '<meta name="naver-site-verification" content="72ea1840fce7ad9dbd92b0ae5909fe0455a784a4" /></head>';
    location = /naver3eea2962cade5b83940183dd3224d099.html {
        default_type text/html;
        return 200 "naver-site-verification: naver3eea2962cade5b83940183dd3224d099.html";
    }
    location / { try_files $uri $uri/ $uri.html =404; }
}
