# FLY LAB — 원본 LeeHueeng/fly-lab (앱 저장소 그대로). 개발용 파일은 공개하지 않는다.
server {
    listen 80;
    server_name fly.hueeng.com;
    root /srv/sites/fly;
    index index.html;
    charset utf-8;
    if ($plain_http) { return 308 https://$host$request_uri; }
    include /etc/nginx/snippets/common.conf;
    location ~ ^/(scripts/|server\.js$|package(-lock)?\.json$|Dockerfile$|CONTRIBUTING\.md$|SECURITY\.md$|README\.ko\.md$|LICENSE$) { return 404; }
    location / { try_files $uri $uri/ =404; }
}

# 여행여권 — 원본 LeeHueeng/phototravelmap-site (GitHub Pages leehueeng.github.io/phototravelmap-site/).
# 같은 파일을 이 도메인 기준 URL(canonical·og·사이트맵)로 바꿔 내보내고, 이 도메인의 네이버 인증을 붙인다.
server {
    listen 80;
    server_name passport.hueeng.com;
    root /srv/sites/passport;
    index index.html;
    if ($plain_http) { return 308 https://$host$request_uri; }
    include /etc/nginx/snippets/common.conf;
    sub_filter_types text/plain text/xml application/xml;
    sub_filter_once off;
    sub_filter 'https://leehueeng.github.io/phototravelmap-site/' 'https://passport.hueeng.com/';
    sub_filter '</head>' '<meta name="naver-site-verification" content="72ea1840fce7ad9dbd92b0ae5909fe0455a784a4" /></head>';
    location = /naver3eea2962cade5b83940183dd3224d099.html {
        default_type text/html;
        return 200 "naver-site-verification: naver3eea2962cade5b83940183dd3224d099.html";
    }
    location / { try_files $uri $uri/ $uri.html =404; }
}
