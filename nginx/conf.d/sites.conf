# 라스트 블록 — 게임 소개. 지원·개인정보·데이터 삭제 문서는 게임 서버(survival.hueeng.com/legal/)에 있고,
# survival.hueeng.com/ (루트)는 Cloudflare 리다이렉트 규칙이 이 사이트로 보낸다.
server {
    listen 80;
    server_name lastblock.hueeng.com;
    root /srv/sites/lastblock;
    index index.html;
    if ($plain_http) { return 308 https://$host$request_uri; }
    include /etc/nginx/snippets/common.conf;
    # Legal documents remain synchronized with the game server.
    location ~ ^/legal/(?:en/)?terms\.html$ {
        set $terms_origin survival.hueeng.com;
        proxy_pass https://$terms_origin$request_uri;
        proxy_set_header Host $terms_origin;
        proxy_ssl_name $terms_origin;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 4;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 8s;
        proxy_read_timeout 15s;
        sub_filter_once off;
        sub_filter 'https://survival.hueeng.com/legal/' 'https://lastblock.hueeng.com/legal/';
        sub_filter '</head>' '<link rel="stylesheet" href="/legal-theme.css?v=20261106"></head>';
        sub_filter '<body>' '<body><a class="legal-home" href="/">← 라스트 블록 홈</a>';
        sub_filter '</h1>' '</h1><p class="legal-summary">2026.11.06 · <a href="#consumer-rights">소비자 권리 보완 안내</a> — 법률상 환불·구제 권리는 유지됩니다.</p>';
        sub_filter '</body>' '<aside id="consumer-rights" class="legal-rights" aria-label="소비자 권리 안내"><h2>소비자 권리 안내 · 2026년 11월 6일</h2><p>아래 약관의 면책·환불 제한·관할·변경 조항은 대한민국 및 이용자의 거주국에서 적용되는 강행적 소비자 보호 규정에 우선하지 않습니다. EEA·영국 등을 포함하여 법률이 보장하는 디지털 콘텐츠의 적합성, 보완, 대금 감액, 계약 해제, 환불 및 손해배상 권리는 해당 요건에 따라 유지됩니다. 운영자의 고의·중과실이나 법률상 배제할 수 없는 책임을 면제하지 않습니다.</p><p>디지털 콘텐츠를 이용했다는 사정만으로 모든 청약철회·환불 권리가 없어지는 것은 아닙니다. 철회 제한은 사전 고지·동의·시험 이용 등 해당 법률의 요건을 충족한 범위에서만 적용되며, 미제공·하자·표시와 다른 제공에 대한 권리는 유지됩니다. 스토어 절차와 별도로 운영자에게도 문제를 접수할 수 있습니다.</p><p>계속 이용하거나 답변하지 않았다는 이유만으로 법률상 필요한 동의를 대신하지 않습니다. 이용 제한 시 긴급한 보호 조치가 필요한 경우를 제외하고 사유와 이의 제기 방법을 안내하며, 긴급 조치 후에도 법률상 제한이 없으면 이를 안내합니다. 분쟁은 법률상 관할 법원 또는 소비자 분쟁 해결기관에 제기할 수 있습니다. 이 안내는 기존 권리를 명확히 하며 새로운 이용 제한을 추가하지 않습니다.</p><p lang="en">Mandatory consumer rights in your country, including applicable EEA and UK rights, remain in force. Exclusions and restrictions do not override statutory conformity, repair, price-reduction, termination, refund or compensation rights. Digital use alone does not remove all withdrawal rights. Legally required notice and consent must be obtained; continued use alone does not replace them. You may contact the operator, competent courts or consumer dispute-resolution bodies.</p></aside></body>';
    }
    location ~ ^/legal/(?:en/)?(?:privacy\.html|account-deletion\.html|support\.html|legal\.css)$ {
        set $terms_origin survival.hueeng.com;
        proxy_pass https://$terms_origin$request_uri;
        proxy_set_header Host $terms_origin;
        proxy_ssl_name $terms_origin;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 4;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 8s;
        proxy_read_timeout 15s;
        sub_filter_once off;
        sub_filter 'https://survival.hueeng.com/legal/' 'https://lastblock.hueeng.com/legal/';
        sub_filter '</head>' '<link rel="stylesheet" href="/legal-theme.css?v=20261106"></head>';
        sub_filter '<body>' '<body><a class="legal-home" href="/">← 라스트 블록 홈</a>';
    }
    location / { try_files $uri $uri/ $uri.html =404; }
}

# 뚝딱무비 — 앱 소개. 웹 편집기는 vido.hueeng.com, 약관·개인정보·계정 삭제는 vido-api.hueeng.com (뚝딱무비 자체 배포).
server {
    listen 80;
    server_name vidomaker.hueeng.com;
    root /srv/sites/vidomaker;
    index index.html;
    if ($plain_http) { return 308 https://$host$request_uri; }
    include /etc/nginx/snippets/common.conf;
    # Live upstream retains its date-based terms edition switch.
    location ~ "^/terms(?:/20[0-9]{2}-[01][0-9]-[0-3][0-9])?$" {
        set $terms_origin vido-api.hueeng.com;
        proxy_pass https://$terms_origin$request_uri;
        proxy_set_header Host $terms_origin;
        proxy_ssl_name $terms_origin;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 4;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 8s;
        proxy_read_timeout 15s;
        sub_filter_once off;
        sub_filter 'href="/style.css"' 'href="/legal-theme.css?v=20261106"';
        sub_filter 'href="/favicon.png"' 'href="/assets/icon-32.png"';
        sub_filter 'href="/privacy"' 'href="https://vido-api.hueeng.com/privacy"';
        sub_filter '<h1>이용약관</h1>' '<h1>이용약관</h1><p class="legal-summary">2026.11.06 · <a href="#consumer-rights">소비자 권리 보완 안내</a> — 법률상 환불·구제 권리는 유지됩니다.</p>';
