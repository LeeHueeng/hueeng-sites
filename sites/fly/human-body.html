<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1a3026"><meta name="description" content="인간의 몸에 초파리식 감각·운동 신호를 연결하는 가상 3D 게임. FLY LAB의 여섯 번째 실험.">
<title>인간 몸 × 초파리 신경계 | FLY LAB</title><link rel="stylesheet" href="./human-body.css?v=20260914o">
  <link rel="stylesheet" href="project-links.css?v=20260914s">
  <script type="module" src="project-links.js?v=20260914s"></script>
</head>
<body>
<header class="h-header"><a class="h-brand" href="./">FLY <span>LAB</span><small>EXPERIMENT / 06</small></a><nav><a href="./" data-copy="back">모든 실험</a><select id="bodyLanguage" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">中文</option><option value="es">Español</option></select></nav></header>
<main>
<section class="h-intro"><div><p class="h-kicker" data-copy="title">인간 몸 × 초파리 신경계</p><h1 data-copy="headline">작은 뇌, 낯선 몸.</h1><p data-copy="intro"></p></div><div class="h-identity" aria-hidden="true"><span>FLY<br>SIGNALS</span><b>→</b><span>HUMAN<br>BODY</span><small>01 BODY / 02 LEGS / NO WINGS</small></div></section>
<p class="h-model-note" data-copy="note"></p>
<section class="h-mission"><div><strong id="hMode" data-copy="sandbox"></strong><p data-copy="objective"></p></div><div class="h-mode-buttons"><button id="hSandbox" data-copy="sandbox"></button><button id="hChallenge" class="h-primary" data-copy="challenge"></button></div></section>
<div class="h-lab">
<section class="h-playground" aria-label="3D game">
<div class="h-stats"><div><span data-copy="time"></span><strong id="hTime">0.0</strong></div><div><span data-copy="fruit"></span><strong id="hFruit">0 / 3</strong></div><div><span data-copy="balance"></span><strong id="hBalance">100</strong></div><div><span data-copy="energy"></span><strong id="hEnergy">100</strong></div><div><span data-copy="best"></span><strong id="hBest">0</strong></div></div>
<div class="h-stage"><div id="hWorld"></div><div class="h-world-label"><span>BODY / 01</span><span id="hSpeed">0.00 m/s</span></div><div id="hFinish" class="h-finish" hidden><small>EXPERIMENT COMPLETE</small><h2 id="hOutcome"></h2><strong id="hFinalScore"></strong><p id="hResultHint"></p><button id="hRetry" class="h-primary" data-copy="retry"></button></div></div>
<div class="h-status"><i></i><p id="hStatus" role="status" aria-live="polite"></p></div>
<div class="h-toolbar"><button id="hPlay" class="h-primary" data-copy="play"></button><button id="hReset" data-copy="reset"></button><label><span data-copy="camera"></span><select id="hCamera"><option value="orbit" data-copy="orbit"></option><option value="follow" data-copy="follow"></option><option value="first" data-copy="first"></option></select></label><label><span data-copy="tool"></span><select id="hTool"><option value="orbit" data-copy="observe"></option><option value="food" data-copy="foodTool"></option><option value="ball" data-copy="ballTool"></option></select></label><label class="h-check"><input id="hOdorView" type="checkbox" checked><span data-copy="odorView"></span></label></div>
<p class="h-hint" id="hPlaceHint" data-copy="placeHint"></p>
<div class="h-stimulus"><div class="h-section-title"><h2 data-copy="stimulate"></h2><span>INPUT / 02</span></div><div class="h-signal-pad"><button data-signal="left"><kbd>A</kbd><span data-copy="left"></span></button><button data-signal="forward"><kbd>W</kbd><span data-copy="forward"></span></button><button data-signal="right"><kbd>D</kbd><span data-copy="right"></span></button><button data-signal="brake"><kbd>S</kbd><span data-copy="brake"></span></button><button data-signal="flight"><kbd>SPACE</kbd><span data-copy="flight"></span></button><button data-signal="groom"><kbd>G</kbd><span data-copy="groom"></span></button></div><p class="h-hint" data-copy="keys"></p></div>
</section>
<aside class="h-neural-panel">
<div class="h-section-title"><h2 data-copy="bridge"></h2><span>DECODER / 01</span></div>
<label class="h-decoder"><input id="hDecoder" type="checkbox" checked><span><strong id="hDecoderLabel"></strong><small>FLY COMMAND → BIPED ACTION</small></span><i></i></label>
<p class="h-hint" data-copy="bridgeNote"></p>
<label class="h-check h-autonomous"><input id="hAuto" type="checkbox" checked><span data-copy="auto"></span></label>
<section class="h-brain" aria-labelledby="hBrainTitle"><div class="h-section-title"><h2 id="hBrainTitle" data-copy="brainTitle"></h2><span>JFRC2 / ATLAS</span></div><p class="h-brain-caption" data-copy="brainCaption"></p><div class="h-brain-stage"><canvas id="hBrainCanvas" tabindex="0"></canvas><p id="atlasStatus" role="status"></p></div><div class="h-brain-toolbar"><span data-copy="brainLive"></span><button id="resetView" type="button" data-copy="brainReset"></button></div><div id="regionList" class="h-brain-regions"></div><p id="regionDescription" class="h-brain-description"></p><div class="h-brain-history-title" data-copy="brainHistory"></div><canvas id="hBrainSignal"></canvas><p class="h-brain-note" data-copy="brainModelNote"></p><div class="h-motor-pair"><div class="h-neuron" data-node="left"><label data-copy="leftLeg"></label><output>0</output><i></i></div><div class="h-neuron h-right-motor" data-node="right"><label data-copy="rightLeg"></label><output>0</output><i></i></div></div></section>
<div class="h-tuning"><div class="h-section-title"><h2 data-copy="sensitivity"></h2><span>GAIN / MASS</span></div><label><span data-copy="visualGain"></span><output id="hVisualValue">1.0×</output><input id="hVisual" type="range" min="0" max="2" step="0.1" value="1"></label><label><span data-copy="odorGain"></span><output id="hOdorValue">1.0×</output><input id="hOdor" type="range" min="0" max="2" step="0.1" value="1"></label><label><span data-copy="reflexGain"></span><output id="hReflexValue">1.0×</output><input id="hReflex" type="range" min="0" max="2" step="0.1" value="1"></label><label><span data-copy="mass"></span><output id="hMassValue">72 kg</output><input id="hMass" type="range" min="45" max="110" step="1" value="72"></label></div>
</aside>
</div>
<footer class="h-footer"><span>FLY LAB · STRANGE BODIES SERIES</span><a href="./" data-copy="back"></a></footer>
</main><script type="module" src="./human-body.js?v=20260914o"></script>
</body></html>
