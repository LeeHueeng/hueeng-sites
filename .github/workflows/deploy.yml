name: Deploy
# main 에 push → 홈서버(LXC 101) self-hosted 러너가 /opt/hueeng-sites/deploy.sh 를 실행한다.
# 서브모듈 원본 저장소(simcha-site·fly-lab·phototravelmap-site)의 변경은 서버의 hueeng-sites-sync.timer 가 5분마다 따라간다.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: [self-hosted, homelab, sites]
    timeout-minutes: 10
    steps:
      - name: Deploy
        run: |
          set -euo pipefail
          # deploy.sh 자신도 이번 커밋 것으로 돌도록, 같은 잠금 안에서 체크아웃부터 맞춘다
          flock -w 300 /run/lock/hueeng-sites-deploy.lock git -C /opt/hueeng-sites fetch -q --prune origin main
          flock -w 300 /run/lock/hueeng-sites-deploy.lock git -C /opt/hueeng-sites reset -q --hard origin/main
          FORCE=1 /opt/hueeng-sites/deploy.sh
